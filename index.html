<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Донор+ · Biopharma Plasma</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #E8EFF8; color: #132238; }
    .shell { max-width: 430px; min-height: 100vh; margin: 0 auto; background: #F4F7FC; display: flex; flex-direction: column; }
    .navy { background: linear-gradient(145deg, #0B1F3A 0%, #143666 100%); }
    .tab.active { color: #1D5FB8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="shell shadow-xl relative">
    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-[390px] bg-[#0B1F3A] text-white px-4 py-3 rounded-2xl shadow-lg text-xs font-medium text-center"></div>

    <!-- ВХІД ПО НОМЕРУ -->
    <section id="view-login" class="flex-1 flex flex-col justify-center p-6 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 mx-auto rounded-2xl navy text-amber-400 flex items-center justify-center text-2xl font-extrabold shadow-lg">Д+</div>
        <h1 class="text-2xl font-extrabold text-[#0B1F3A]">Вхід у Донор+</h1>
        <p class="text-xs text-slate-500">Введіть ваш номер телефону, щоб побачити ставку, обсяг плазми та мерч.</p>
      </div>

      <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3">
        <label for="phone-input" class="text-xs font-bold text-slate-600 block">Номер телефону</label>
        <input id="phone-input" type="tel" placeholder="+380 ..." class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-base font-semibold text-[#0B1F3A] focus:outline-none focus:border-[#1D5FB8]" />
        <p id="login-error" class="hidden text-xs text-rose-600 font-semibold"></p>
        <button id="btn-login" type="button" onclick="handleLogin()" class="w-full py-3.5 rounded-2xl bg-[#1D5FB8] active:bg-[#14478E] text-white font-bold text-sm shadow">Увійти в кабінет</button>
        <p id="db-status" class="text-[11px] text-center text-slate-400">Завантаження бази...</p>
      </div>
    </section>

    <!-- ОСНОВНИЙ ДОДАТОК -->
    <div id="app-main" class="hidden flex-1 flex flex-col">
      <header class="px-4 py-3 bg-white border-b border-slate-200 flex items-center justify-between sticky top-0 z-20">
        <div>
          <span class="font-extrabold text-base text-[#0B1F3A]">Донор+</span>
          <p id="greeting" class="text-xs text-slate-500 font-medium"></p>
        </div>
        <div class="flex items-center gap-1.5">
          <button type="button" onclick="syncDb()" class="text-xs font-semibold text-[#1D5FB8] bg-blue-50 px-2.5 py-1.5 rounded-xl">Оновити</button>
          <button type="button" onclick="logout()" class="text-xs font-semibold text-slate-600 bg-slate-100 px-2.5 py-1.5 rounded-xl">Вийти</button>
        </div>
      </header>

      <main class="flex-1 p-4 pb-24 space-y-4">
        <section id="view-home" class="space-y-4">
          <div class="navy rounded-3xl p-5 text-white shadow-lg">
            <div class="flex justify-between items-start">
              <div>
                <p id="stage-label" class="text-xs uppercase tracking-wider text-blue-200">Наступна виплата</p>
                <div class="flex items-center gap-2 mt-1">
                  <span id="next-payout" class="text-4xl font-extrabold">500 ₴</span>
                  <span id="rate-badge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300"></span>
                </div>
              </div>
              <div class="text-right">
                <span class="text-[11px] text-blue-200 block">Здач</span>
                <span id="hero-count" class="text-xl font-bold">0</span>
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-white/10">
              <div class="flex justify-between text-xs mb-1.5">
                <span id="prog-label" class="text-blue-100"></span>
                <span id="prog-pct" class="font-bold text-amber-300">0%</span>
              </div>
              <div class="w-full h-2 bg-white/15 rounded-full overflow-hidden">
                <div id="prog-bar" class="h-full bg-amber-400 rounded-full transition-all duration-500" style="width:10%"></div>
              </div>
            </div>
          </div>

          <div id="active-booking-card" class="hidden bg-emerald-50 border border-emerald-200 rounded-3xl p-4 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-extrabold uppercase text-emerald-700">Ваш активний запис</span>
                <p id="booking-summary" class="text-sm font-bold text-[#0B1F3A] mt-0.5"></p>
                <p id="booking-center-txt" class="text-xs text-slate-600"></p>
              </div>
              <button type="button" onclick="cancelBooking()" class="text-xs font-bold text-rose-600 bg-white px-2.5 py-1 rounded-xl border border-rose-200">Скасувати</button>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-5 border border-slate-200 flex items-center gap-4">
            <div class="w-20 h-20 rounded-full border-[7px] border-[#1D5FB8] flex flex-col items-center justify-center shrink-0">
              <span id="days-num" class="text-xl font-extrabold text-[#0B1F3A] leading-none">0</span>
              <span id="days-caption" class="text-[10px] text-slate-500">днів</span>
            </div>
            <div>
              <span id="window-pill" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700"></span>
              <p id="window-text" class="text-xs text-slate-600 mt-1.5"></p>
            </div>
          </div>

          <button type="button" onclick="openBooking()" class="w-full py-3.5 rounded-2xl bg-[#1D5FB8] text-white font-bold text-sm shadow">Обрати дату та час донації</button>

          <div class="bg-amber-50 border border-
